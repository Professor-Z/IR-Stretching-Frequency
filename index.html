<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bond Vibrations</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1120; color: #e5e7eb;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    /* ---- Slide-down CONTROLS bar (same pattern as E2.html) ---- */
    #controls-wrap { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; flex-direction: column; align-items: center;
        transform: translateY(calc(-100% + 30px)); transition: transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1); pointer-events: none; }
    #controls-wrap:hover, #controls-wrap:focus-within, #controls-wrap.open { transform: translateY(0); }
    #controls-wrap > * { pointer-events: auto; }
    .glass-panel { background: rgba(17, 24, 39, 0.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(75, 85, 99, 0.7); box-shadow: 0 10px 30px rgba(0,0,0,0.45); }
    #controls-panel { width: 100%; border-width: 0 0 1px 0; padding: 0.75rem 1.25rem 0.6rem; }
    #controls-tab { height: 30px; background: #22e55e; color: #04290f; font-weight: 800; font-size: 13px; letter-spacing: 0.2em;
        padding: 6px 28px 0; border-radius: 0 0 12px 12px; box-shadow: 0 0 14px rgba(34,229,94,0.75), 0 0 30px rgba(34,229,94,0.35);
        cursor: pointer; user-select: none; }
    .cp-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.7rem 1.6rem; }
    .cp-group { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .cp-title h1 { margin: 0; font-size: 1.2rem; font-weight: 700; color: #60a5fa; line-height: 1.2; }
    .cp-title div { font-size: 0.75rem; font-weight: 600; color: #9ca3af; }
    .eq { display: inline-flex; align-items: center; gap: 0.3rem; font-family: "Times New Roman", Georgia, serif; font-size: 1.05rem; color: #f3f4f6;
        padding: 0.2rem 0.6rem; border: 1px solid #374151; border-radius: 0.4rem; background: rgba(31,41,55,0.6); }
    .frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; font-size: 0.85em; }
    .frac span:first-child { border-bottom: 1px solid #e5e7eb; padding: 0 0.15em; }
    .sqrt { display: inline-flex; align-items: center; }
    .sqrt .rad { font-size: 1.5em; line-height: 1; }
    .sqrt .under { border-top: 1px solid #e5e7eb; padding-left: 0.1em; }
    .i { font-style: italic; }
    .nu { position: relative; font-style: italic; }
    .nu .tl { position: absolute; left: 0.12em; top: -0.55em; font-size: 0.8em; font-style: normal; }
    .bond-group { display: flex; align-items: center; gap: 0.35rem; padding: 0.3rem 0.5rem; border-radius: 0.45rem;
        border: 1px solid #374151; background: rgba(31,41,55,0.55); }
    .bond-tag { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em; margin-right: 0.15rem; }
    select { background: #1f2937; color: #f9fafb; border: 1px solid #4b5563; border-radius: 0.35rem; padding: 0.25rem 0.35rem;
        font-size: 0.8rem; font-weight: 600; outline: none; cursor: pointer; }
    select:focus { border-color: #60a5fa; }
    select:disabled { opacity: 0.4; cursor: not-allowed; }
    option:disabled { color: #6b7280; }
    .cp-btn { padding: 0.4rem 0.7rem; border-radius: 0.375rem; font-size: 0.75rem; line-height: 1rem; font-weight: 700; white-space: nowrap;
        transition: background-color .15s; box-shadow: 0 1px 3px rgba(0,0,0,.4); color: #fff; border: 0; cursor: pointer; }
    .btn-blue { background: #2563eb; } .btn-blue:hover { background: #3b82f6; }
    .btn-gray { background: #374151; } .btn-gray:hover { background: #4b5563; }
    .btn-morse { background: transparent; border: 1px solid #a855f7; color: #d8b4fe; } .btn-morse:hover, .btn-morse.on { background: #9333ea; color: #fff; }
    .lbl { font-size: 0.72rem; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.04em; }
    input[type=range] { accent-color: #22e55e; width: 110px; }
    #speed-val { font-size: 0.75rem; font-weight: 700; color: #e5e7eb; min-width: 2.6em; }
    #focus-bar { position: fixed; z-index: 10; display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; transform: translateX(-50%);
        width: max-content; max-width: 94vw; opacity: 0; pointer-events: none; transition: opacity .35s; }
    #focus-bar.show { opacity: 1; pointer-events: auto; }
    .btn-ir { background: #dc2626; box-shadow: 0 0 12px rgba(239,68,68,0.55); } .btn-ir:hover { background: #ef4444; }
    .btn-green { background: #16a34a; box-shadow: 0 0 12px rgba(34,197,94,0.5); } .btn-green:hover { background: #22c55e; }
    .cp-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
    @media (max-width: 719px) { #focus-bar .cp-btn { padding: 0.35rem 0.5rem; font-size: 0.7rem; } }
    #hint { margin-top: 0.45rem; text-align: center; font-size: 0.75rem; font-weight: 600; color: #4ade80; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="focus-bar">
    <button id="btn-ex1" class="cp-btn btn-ir">EXCITATION to n = 1</button>
    <button id="btn-ex2" class="cp-btn btn-ir">EXCITATION to n = 2</button>
    <button id="btn-relax" class="cp-btn btn-green">RELAX to n = 0</button>
</div>

<div id="controls-wrap">
    <div id="controls-panel" class="glass-panel">
        <div class="cp-row">
            <div class="cp-title">
                <h1>Bond Vibrations</h1>
                <div>IR Stretching Frequencies</div>
            </div>
            <div class="eq" title="Harmonic oscillator: wavenumber of absorption">
                <span class="nu">ν<span class="tl">~</span></span> =
                <span class="frac"><span>1</span><span>2π<span class="i">c</span></span></span>
                <span class="sqrt"><span class="rad">√</span><span class="under"><span class="frac"><span class="i">k</span><span class="i">μ</span></span></span></span>
            </div>
            <div id="bond-groups" class="cp-group"></div>
            <div class="cp-group">
                <span class="lbl">Speed</span>
                <input id="speed" type="range" min="0.1" max="1" step="0.05" value="1">
                <span id="speed-val">1.0×</span>
                <button id="btn-pause" class="cp-btn btn-blue">PAUSE</button>
                <button id="btn-details" class="cp-btn btn-gray">μ &amp; k: OFF</button>
                <button id="btn-morse" class="cp-btn btn-morse on">HIDE MORSE POTENTIAL</button>
            </div>
        </div>
    </div>
    <div id="controls-tab">CONTROLS</div>
</div>

<script>
(() => {
'use strict';

// ---------------- Data ----------------
// Average atomic masses (u), covalent radii (pm) and CPK-style colours.
const EL = {
    H:  { m: 1.008,   cov: 31,  color: '#d9dde3', ink: '#1f2937' },
    C:  { m: 12.011,  cov: 76,  color: '#4a4f57', ink: '#f3f4f6' },
    N:  { m: 14.007,  cov: 71,  color: '#2f5fc4', ink: '#f3f4f6' },
    O:  { m: 15.999,  cov: 66,  color: '#c62f2b', ink: '#f9fafb' },
    F:  { m: 18.998,  cov: 57,  color: '#8fbf45', ink: '#1a2a08' },
    Cl: { m: 35.45,   cov: 102, color: '#35a650', ink: '#06210d' },
    Br: { m: 79.904,  cov: 120, color: '#8c2a24', ink: '#f9fafb' },
    I:  { m: 126.904, cov: 139, color: '#6f2aa3', ink: '#f9fafb' }
};
const ATOMS = ['H', 'C', 'N', 'O', 'F', 'Cl', 'Br', 'I'];
const HALOGENS = ['F', 'Cl', 'Br', 'I'];

// Stretching force constants k (N/m) and bond lengths (pm) for each pair and bond order.
// k values are fitted so that the 0→1 transition of the Morse oscillator (the IR absorption)
// matches typical observed stretching bands. The big ν̃ on each card is the harmonic value from
// the equation, which is slightly higher than the absorption because real bonds are anharmonic.
const BOND_DATA = { 'H|H|1':[580,74], 'H|N|1':[690,101], 'H|O|1':[795,96], 'H|F|1':[965,92], 'H|Cl|1':[525,127], 'H|Br|1':[420,141], 'H|I|1':[320,161], 'C|C|1':[365,154], 'C|C|2':[995,134], 'C|C|3':[1685,120], 'C|N|1':[530,147], 'C|N|2':[1085,128], 'C|N|3':[1990,116], 'C|O|1':[510,143], 'C|O|2':[1220,121], 'C|O|3':[1900,113], 'C|F|1':[590,135], 'C|Cl|1':[305,177], 'C|Br|1':[225,194], 'C|I|1':[165,214], 'N|N|1':[490,145], 'N|N|2':[1080,125], 'N|N|3':[2310,110], 'N|O|1':[420,140], 'N|O|2':[1090,121], 'N|O|3':[2390,106], 'O|O|1':[395,148], 'O|O|2':[1185,121], 'N|F|1':[400,137], 'N|Cl|1':[300,175], 'N|Br|1':[260,190], 'N|I|1':[195,210], 'O|F|1':[370,142], 'O|Cl|1':[330,170], 'O|Br|1':[310,185], 'O|I|1':[270,200], 'F|F|1':[480,142], 'Cl|Cl|1':[335,199], 'Br|Br|1':[250,228], 'I|I|1':[175,267], 'F|Cl|1':[465,163], 'F|Br|1':[420,176], 'F|I|1':[370,191], 'Cl|Br|1':[290,214], 'Cl|I|1':[245,232], 'Br|I|1':[210,247] };

// C–H by carbon hybridization: more s character -> shorter, stiffer, stronger bond.
Object.assign(BOND_DATA, { 'H|C|1|sp3': [520, 109], 'H|C|1|sp2': [565, 108], 'H|C|1|sp': [640, 106] });
const HYBS = [
    { key: 'sp3', sup: 'sp³', name: 'sp³ (alkane)' },
    { key: 'sp2', sup: 'sp²', name: 'sp² (alkene)' },
    { key: 'sp',  sup: 'sp',  name: 'sp (alkyne)' }
];
// Approximate bond dissociation energies D0 (kJ/mol): typical/average values used to set the depth of each Morse well.
const BDE = { 'H|H|1':436, 'H|C|1|sp3':423, 'H|C|1|sp2':464, 'H|C|1|sp':558, 'H|N|1':391, 'H|O|1':463, 'H|F|1':567, 'H|Cl|1':431, 'H|Br|1':366, 'H|I|1':299,
    'C|C|1':348, 'C|C|2':614, 'C|C|3':839, 'C|N|1':293, 'C|N|2':615, 'C|N|3':891, 'C|O|1':358, 'C|O|2':745, 'C|O|3':1072,
    'C|F|1':485, 'C|Cl|1':328, 'C|Br|1':276, 'C|I|1':240, 'N|N|1':163, 'N|N|2':418, 'N|N|3':941, 'N|O|1':201, 'N|O|2':607, 'N|O|3':1051,
    'O|O|1':146, 'O|O|2':495, 'N|F|1':272, 'N|Cl|1':200, 'N|Br|1':243, 'N|I|1':159, 'O|F|1':190, 'O|Cl|1':203, 'O|Br|1':234, 'O|I|1':234,
    'F|F|1':155, 'Cl|Cl|1':242, 'Br|Br|1':193, 'I|I|1':151, 'F|Cl|1':253, 'F|Br|1':237, 'F|I|1':278, 'Cl|Br|1':218, 'Cl|I|1':211, 'Br|I|1':179 };
const CM_TO_KJ = 0.0119627;        // 1 cm^-1 = 0.0119627 kJ/mol
const N_A = 6.02214076e23;
const AMU = 1.66053907e-27;        // kg
const C_CM = 2.99792458e10;        // speed of light, cm/s
const BASE_RATE = 800;             // on-screen vibration: 1 Hz per 800 cm^-1 at speed 1x
const SLOT_COLORS = ['#38bdf8', '#fbbf24', '#f472b6'];
const ORDER_SYM = { 1: '–', 2: '=', 3: '≡' };
const ORDER_NAME = { 1: 'single', 2: 'double', 3: 'triple' };

function maxOrder(a, b) {
    if (a === 'NONE' || b === 'NONE') return 0;
    if (a === 'H' || b === 'H' || HALOGENS.includes(a) || HALOGENS.includes(b)) return 1;
    if (a === 'O' && b === 'O') return 2;   // no O≡O
    return 3;
}
const isCH = (a, b) => (a === 'C' && b === 'H') || (a === 'H' && b === 'C');
function bondInfo(a, b, order, hyb) {
    const [x, y] = [a, b].sort((p, q) => ATOMS.indexOf(p) - ATOMS.indexOf(q));
    const ch = isCH(a, b);
    const key = `${x}|${y}|${order}` + (ch ? `|${hyb || 'sp3'}` : '');
    const d = BOND_DATA[key];
    const mA = EL[a].m, mB = EL[b].m;
    const mu = mA * mB / (mA + mB);                                   // u
    const k = d[0];                                                   // N/m
    const nu = Math.sqrt(k / (mu * AMU)) / (2 * Math.PI * C_CM);      // cm^-1  (the attached equation)
    const info = { a, b, order, hyb: ch ? (hyb || 'sp3') : null, mu, k, nu, r: d[1], D0: BDE[key] };
    info.morse = morseParams(info);
    return info;
}
// Morse potential V(r) = De(1 - e^{-a(r - re)})^2 - De (zero = separated atoms), with the same k at the minimum.
function morseParams(info) {
    const De = info.D0 + 0.5 * info.nu * CM_TO_KJ;                    // well depth = D0 + zero-point energy (kJ/mol)
    const a = Math.sqrt(info.k / (2 * De * 1000 / N_A)) * 1e-12;      // pm^-1
    const we = info.nu, wexe = we * we / (4 * De / CM_TO_KJ);         // cm^-1
    const G = [0, 1, 2].map(v => (we * (v + 0.5) - wexe * (v + 0.5) ** 2) * CM_TO_KJ);   // kJ/mol above the minimum
    const re = info.r;
    const V = r => De * (1 - Math.exp(-a * (r - re))) ** 2 - De;
    const turn = E => { const s = Math.sqrt(E / De); return [re - Math.log(1 + s) / a, re - Math.log(1 - s) / a]; };
    return { De, a, we, wexe, G, V, turn, fund: (G[1] - G[0]) / CM_TO_KJ, over: (G[2] - G[0]) / CM_TO_KJ,
        freqAt: E => we * Math.sqrt(Math.max(0, 1 - E / De)) };   // classical Morse frequency at energy E above the minimum
}
// Zero-point-style relative amplitude ∝ (μk)^-1/4, normalised to C–O and exaggerated for visibility.
const REF_MUK = (12.011 * 15.999 / 28.01) * 510;
function amplitudePm(info) { return 26 * Math.pow(REF_MUK / (info.mu * info.k), 0.25); }
function dispRadius(el) { return 14 + 0.34 * EL[el].cov; }           // pm, for drawing

// ---------------- Colour helpers ----------------
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(h, target, t) { const a = hexRgb(h); return `rgb(${a.map((v, i) => Math.round(v + (target[i] - v) * t)).join(',')})`; }
const lighten = (h, t) => mix(h, [255, 255, 255], t);
const darken = (h, t) => mix(h, [0, 0, 0], t);
function rgba(h, a) { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

// ---------------- State ----------------
const slots = [
    { a: 'NONE', b: 'NONE', order: 1 },
    { a: 'NONE', b: 'NONE', order: 1 },
    { a: 'C', b: 'O', order: 1 }
].map((s, i) => ({ ...s, hyb: 'sp3', n: 0, E: null, trans: null, absorbAt: -1, vis: 1, idx: i, color: SLOT_COLORS[i], info: null, spawn: -1, dying: -1, x: null, phase: 0, markerX: null }));

let paused = false, speed = 1, showDetails = false, showMorse = true, morseT = 1;
let MR = null;   // shared Morse axis ranges (animated)
let focus = null, focusT = 0;   // slot shown on its own after clicking its Morse graph
const photons = [];
let graphRects = [];
const IR_COLOR = '#ff6b3d';
const LEVEL_ENERGY = (s, n) => s.info.morse.G[n];
let now = 0;

// ---------------- Controls ----------------
const groupsEl = document.getElementById('bond-groups');
function atomSelect(val) {
    const s = document.createElement('select');
    ['NONE', ...ATOMS].forEach(e => { const o = document.createElement('option'); o.value = e; o.textContent = e; s.appendChild(o); });
    s.value = val; return s;
}
slots.forEach(slot => {
    const g = document.createElement('div'); g.className = 'bond-group';
    g.style.borderColor = rgba(slot.color, 0.55);
    const tag = document.createElement('span'); tag.className = 'bond-tag'; tag.style.color = slot.color; tag.textContent = `BOND ${slot.idx + 1}`;
    const sa = atomSelect(slot.a), sb = atomSelect(slot.b);
    const so = document.createElement('select');
    sa.setAttribute('aria-label', `Bond ${slot.idx + 1} first atom`);
    sb.setAttribute('aria-label', `Bond ${slot.idx + 1} second atom`);
    g.append(tag, sa, so, sb);
    groupsEl.appendChild(g);
    slot.ui = { sa, sb, so };
    const onChange = e => {
        slot.a = sa.value; slot.b = sb.value;
        refreshOrderOptions(slot);
        if (e && e.target !== so) pickUnusedOrder(slot);   // changing atoms: avoid duplicating a bond already shown
        if (so.dataset.mode === 'hyb') { slot.hyb = so.value; slot.order = 1; } else slot.order = +so.value;
        applySlot(slot);
    };
    sa.addEventListener('change', onChange); sb.addEventListener('change', onChange); so.addEventListener('change', onChange);
    refreshOrderOptions(slot);
});
// If another slot already shows this atom pair with the same bond order (or, for C–H, the same carbon
// hybridization), switch this slot to the next higher option that isn't shown yet, otherwise the next lower one.
const samePair = (s, a, b) => (s.a === a && s.b === b) || (s.a === b && s.b === a);
function pickUnusedOrder(slot) {
    const { so } = slot.ui;
    if (maxOrder(slot.a, slot.b) === 0) return;
    const others = slots.filter(o => o !== slot && maxOrder(o.a, o.b) > 0 && samePair(o, slot.a, slot.b));
    if (!others.length) return;
    const hyb = so.dataset.mode === 'hyb';
    const used = new Set(others.map(o => hyb ? o.hyb : String(o.order)));
    const opts = [...so.options].filter(o => !o.disabled).map(o => o.value);
    const cur = opts.indexOf(so.value);
    if (!used.has(so.value)) return;
    const up = opts.slice(cur + 1).find(v => !used.has(v));
    const down = opts.slice(0, cur).reverse().find(v => !used.has(v));
    const pick = up ?? down;
    if (pick != null) so.value = pick;
}
function refreshOrderOptions(slot) {
    const { so } = slot.ui;
    const mode = isCH(slot.a, slot.b) ? 'hyb' : 'order';
    if (so.dataset.mode !== mode) {
        so.innerHTML = '';
        const add = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; so.appendChild(o); };
        if (mode === 'hyb') { HYBS.forEach(h => add(h.key, `C ${h.name}`)); so.value = slot.hyb; }
        else { [1, 2, 3].forEach(n => add(n, `${ORDER_SYM[n]}  ${ORDER_NAME[n]}`)); so.value = String(slot.order); }
        so.dataset.mode = mode;
        so.setAttribute('aria-label', `Bond ${slot.idx + 1} ${mode === 'hyb' ? 'carbon hybridization' : 'bond order'}`);
    }
    const mx = maxOrder(slot.a, slot.b);
    so.disabled = mx === 0;
    if (mode === 'order') {
        [...so.options].forEach(o => { o.disabled = mx > 0 && +o.value > mx; });
        if (mx > 0 && +so.value > mx) so.value = mx;
    }
}
function applySlot(slot) {
    const visible = !!slot.info && slot.dying < 0;
    if (maxOrder(slot.a, slot.b) === 0) {
        if (visible) slot.dying = now;
        if (focus === slot) exitFocus();
        return;
    }
    const wasShown = visible;
    slot.info = bondInfo(slot.a, slot.b, slot.order, slot.hyb);
    slot.spawn = now; slot.dying = -1; slot.phase = 0;
    slot.n = 0; slot.E = null; slot.trans = null; slot.absorbAt = -1; slot.relax = null; slot.nr = null;
    for (let i = photons.length - 1; i >= 0; i--) if (photons[i].slot === slot) photons.splice(i, 1);
    if (!wasShown) { slot.x = null; slot.gx = null; slot.markerX = null; }
}

const speedEl = document.getElementById('speed'), speedVal = document.getElementById('speed-val');
speedEl.addEventListener('input', () => { speed = +speedEl.value; speedVal.textContent = (speed < 1 && Math.round(speed * 100) % 10 ? speed.toFixed(2) : speed.toFixed(1)) + '×'; });
const pauseBtn = document.getElementById('btn-pause');
pauseBtn.addEventListener('click', () => { paused = !paused; pauseBtn.textContent = paused ? 'PLAY' : 'PAUSE'; });
const detBtn = document.getElementById('btn-details');
const morseBtn = document.getElementById('btn-morse');
morseBtn.addEventListener('click', () => { showMorse = !showMorse; morseBtn.classList.toggle('on', showMorse); morseBtn.textContent = showMorse ? 'HIDE MORSE POTENTIAL' : 'SHOW MORSE POTENTIAL'; });
detBtn.addEventListener('click', () => { showDetails = !showDetails; detBtn.innerHTML = `μ &amp; k: ${showDetails ? 'ON' : 'OFF'}`; });

// Slide-down bar: open on hover, close when the pointer leaves (and drop focus so it can close). Tap the tab on touch screens.
const wrap = document.getElementById('controls-wrap');
wrap.addEventListener('mouseleave', () => setTimeout(() => {
    if (!wrap.matches(':hover')) { if (wrap.contains(document.activeElement)) document.activeElement.blur(); wrap.classList.remove('open'); }
}, 250));
document.getElementById('controls-tab').addEventListener('click', () => wrap.classList.toggle('open'));
document.getElementById('stage').addEventListener('pointerdown', () => { wrap.classList.remove('open'); if (wrap.contains(document.activeElement)) document.activeElement.blur(); });

// ---------------- Canvas ----------------
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

            for (let k = 0; k < 3; k++) {
                const ph = ((now - s.relax.t0) * 0.7 + k / 3) % 1;
                const rr = R0 * (1 + ph * 1.6);
                ctx.strokeStyle = `rgba(251,146,60,${0.35 * (1 - ph)})`; ctx.lineWidth = 2;
                ctx.beginPath();
                for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.05) {
                    const wob = 1 + 0.05 * Math.sin(a * 9 + now * 6 + k);
                    const xx = s.x + Math.cos(a) * rr * wob * 1.25, yy = y + Math.sin(a) * rr * wob * 0.75;
                    a === 0 ? ctx.moveTo(xx, yy) : ctx.lineTo(xx, yy);
                }
                ctx.stroke();
            }
            ctx.restore();
            if (showLbl) { ctx.save(); ctx.fillStyle = 'rgba(253,186,116,0.9)'; ctx.font = `italic 600 ${Math.round(12 * cardScale + 1)}px ui-sans-serif, system-ui, Arial, sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText('non-radiative decay: energy lost as heat', s.x, y + ATOM_PAD * scale + 12);
            ctx.restore(); }
        }
        const absorbFlash = s.absorbAt >= 0 ? clamp(1 - (now - s.absorbAt) / 0.5, 0, 1) * 0.6 : 0;
        if (grow > 0.15) {
            const bw = Math.max(3, 13 * scale) * shrink, gap = 20 * scale * shrink;
            const bandH = info.order === 1 ? bw : info.order === 2 ? gap + bw * 0.72 : 2 * gap + bw * 0.6;
            drawContactShadow(xA, y, rA, bw, bandH + 2, 1); drawContactShadow(xB, y, rB, bw, bandH + 2, -1);
        }
        drawSphere(xA, y, rA, EL[info.a].color, Math.max(flash, absorbFlash), info.a);
        drawSphere(xB, y, rB, EL[info.b].color, Math.max(flash, absorbFlash), info.b);
        ctx.save(); ctx.globalAlpha *= clamp((age - 0.1) / 0.3, 0, 1) * shrink;
        drawSymbol(xA, y, rA, info.a); drawSymbol(xB, y, rB, info.b);
        ctx.restore();

        const maxR = Math.max(dispRadius(info.a), dispRadius(info.b)) * scale;
        drawFlash(s.x, y, Math.max(70, (info.r + 2 * maxR / scale) * scale * 0.9), age, s.color);
        if (s.absorbAt >= 0) drawFlash(s.x, y, Math.max(60, (info.r + 2 * maxR / scale) * scale * 0.7), now - s.absorbAt, IR_COLOR);
        if (morseT > 0.01 && MR) drawMorse(s, s.gx, s.gy + (1 - morseT) * 24, PW, PH, MR, morseT * s.alpha);
        ctx.save(); ctx.translate(s.x, y - maxR - 30 * cardScale); ctx.scale(cardScale, cardScale);
        drawCard(0, 0, s, s.alpha, (1 - clamp((age - 0.15) / 0.5, 0, 1)) * -12);
        ctx.restore();
        ctx.restore();
    });

    // photons: absorbed on arrival (excites the bond), emitted ones just fly off
    for (let i = photons.length - 1; i >= 0; i--) {
        const p = photons[i];
        if (!p.slot.info) { photons.splice(i, 1); continue; }
        if (now - p.t0 >= p.dur) {
            p.slot.n = p.to; p.slot.absorbAt = now;
            photons.splice(i, 1); continue;
        }
        drawPhoton(p);
    }

    if (live.length === 0) {
        ctx.fillStyle = '#6b7280'; ctx.font = '600 15px ui-sans-serif, system-ui, Arial, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('No bonds selected. Open CONTROLS to choose atoms.', W / 2, H / 2);
    }
    drawRuler(shown);
    updateFocusBar(tgt);
    requestAnimationFrame(frame);
}

// ---------------- Focus mode controls ----------------
const focusBar = document.getElementById('focus-bar');
const ex1 = document.getElementById('btn-ex1'), ex2 = document.getElementById('btn-ex2'), relaxBtn = document.getElementById('btn-relax');
ex1.addEventListener('click', () => focus && excite(focus, 1));
ex2.addEventListener('click', () => focus && excite(focus, 2));
relaxBtn.addEventListener('click', () => focus && relax(focus));
window.addEventListener('keydown', e => { if (e.key === 'Escape') exitFocus(); });
function updateFocusBar(tgt) {
    const on = !!focus && focusT > 0.6;
    focusBar.classList.toggle('show', on);
    if (!focus) return;
    const busy = photons.some(p => p.slot === focus) || !!focus.relax;
    ex1.disabled = busy || focus.n >= 1; ex2.disabled = busy || focus.n >= 2; relaxBtn.disabled = busy || focus.n === 0;
    const top = Math.round(focus.y + tgt.barOff) + 'px', left = Math.round(focus.x) + 'px';
    if (focusBar.style.top !== top) focusBar.style.top = top;
    if (focusBar.style.left !== left) focusBar.style.left = left;
}
cv.addEventListener('click', e => {
    if (!showMorse) return;
    const hit = graphRects.find(r => e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h);
    if (!hit) return;
    if (focus === hit.slot) exitFocus(); else if (!focus) enterFocus(hit.slot);
});
cv.addEventListener('mousemove', e => {
    const hit = showMorse && graphRects.some(r => e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h);
    cv.style.cursor = hit ? 'zoom-in' : 'default';
    if (hit && focus) cv.style.cursor = 'zoom-out';
});

// Start with the C–O single bond (bond 3) alone, its Morse potential already zoomed in.
requestAnimationFrame(tms => {
    const t0 = tms / 1000; last = t0; now = t0;
    slots.forEach(s => { if (maxOrder(s.a, s.b) > 0) { s.info = bondInfo(s.a, s.b, s.order, s.hyb); s.spawn = t0 + 0.25; } });
    focus = slots[2]; focusT = 1;
    requestAnimationFrame(frame);
});

window.__bondSim = { slots, bondInfo, maxOrder, photons, get morseT() { return morseT; }, get focus() { return focus; } };
})();
</script>
</body>
</html>
